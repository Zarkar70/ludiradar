
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Titre SEO -->
    <title>Promotions jeux de société et comparateur de prix | LudiRadar</title>

    <!-- Description Google -->
    <meta
      name="description"
      content="Découvrez les promotions de jeux de société sur LudiRadar. Comparez les prix de plusieurs boutiques, repérez les réductions et trouvez les meilleurs bons plans."
    />

    <!-- Indexation -->
    <meta name="robots" content="index, follow" />

    <!-- Adresse officielle -->
    <link
      rel="canonical"
      href="https://ludiradar.pages.dev/"
    />

    <!-- Icône -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Réseaux sociaux -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="LudiRadar" />
    <meta
      property="og:title"
      content="LudiRadar - Promotions et comparateur de prix de jeux de société"
    />
    <meta
      property="og:description"
      content="Comparez les prix des jeux de société et découvrez les promotions de plusieurs boutiques spécialisées."
    />
    <meta
      property="og:url"
      content="https://ludiradar.pages.dev/"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="LudiRadar - Bons plans jeux de société"
    />
    <meta
      name="twitter:description"
      content="Promotions, réductions et comparateur de prix pour acheter vos jeux de société au meilleur prix."
    />

    <!-- Données structurées -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "LudiRadar",
      "url": "https://ludiradar.pages.dev/",
      "description": "Comparateur de prix et de promotions de jeux de société entre plusieurs boutiques spécialisées.",
      "inLanguage": "fr"
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
