
name: LudiRadar - Actualisation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualisation:
    runs-on: ubuntu-24.04

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les bibliotheques
        run: |
          python -m pip install requests beautifulsoup4

      - name: Verifier les promotions existantes
        run: |
          python -c "import json; from pathlib import Path; p = Path('public/promotions.json'); offres = json.loads(p.read_text(encoding='utf-8')); assert isinstance(offres, list) and len(offres) > 0, 'Aucune promotion'; print(f'{len(offres)} promotions verifiees')"

      # La collecte automatique sera activee apres
      # verification des autorisations de la boutique.
      #
      # - name: Collecter les promotions
      #   run: python scripts/collect.py

      - name: Verifier les modifications
        run: |
          git status --short
          echo "Verification terminee"
