
name: LudiRadar - Actualisation automatique

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: ludiradar-actualisation
  cancel-in-progress: false

jobs:
  actualisation:
    runs-on: ubuntu-24.04

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les bibliotheques
        run: |
          python -m pip install requests beautifulsoup4

      - name: Collecter les promotions Ludifolie
        run: python scripts/collect.py

      - name: Collecter les promotions Philibert
        run: python scripts/collect_philibert.py

      - name: Collecter les promotions Esprit Jeu
        run: python scripts/collect_espritjeu.py

      - name: Collecter les promotions L'Antre Temps
        run: python scripts/collect_antretemps.py

      - name: Verifier le fichier JSON
        run: |
          python -c "import json; from pathlib import Path; offres=json.loads(Path('public/promotions.json').read_text(encoding='utf-8')); assert isinstance(offres,list) and len(offres)>0; print(f'{len(offres)} promotions verifiees')"

      - name: Enregistrer les modifications
        run: |
          git config user.name "LudiRadar Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/promotions.json

          if git diff --cached --quiet; then
            echo "Aucune modification"
          else
            git commit -m "Actualisation automatique des promotions"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
