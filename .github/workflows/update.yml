
name: LudiRadar - Actualisation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualisation:
    runs-on: ubuntu-24.04

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les bibliotheques
        run: |
          python -m pip install requests beautifulsoup4

      - name: Collecter les promotions
        run: python scripts/collect.py

      - name: Enregistrer les modifications
        run: |
          git config user.name "LudiRadar Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/promotions.json
          if git diff --cached --quiet; then
            echo "Aucune modification"
          else
            git commit -m "Actualisation des promotions"
            git push
          fi
